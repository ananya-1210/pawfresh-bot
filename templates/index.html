<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PawFresh Bot — Python demo</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; background:#e5ddd5; margin:0; display:flex; justify-content:center; padding:40px 16px; }
  .card { width:420px; max-width:100%; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 4px 18px rgba(0,0,0,.15); }
  .header { background:#075E54; color:#fff; padding:14px 16px; font-weight:600; }
  .header small { display:block; font-weight:400; opacity:.85; font-size:.75rem; }
  .messages { height:460px; overflow-y:auto; padding:14px; display:flex; flex-direction:column; gap:8px; background:#ece5dd; }
  .row { display:flex; }
  .row.user { justify-content:flex-end; }
  .bubble { max-width:78%; padding:8px 10px; border-radius:8px; font-size:.9rem; line-height:1.4; white-space:pre-wrap; }
  .bot .bubble { background:#fff; border-top-left-radius:0; }
  .user .bubble { background:#dcf8c6; border-top-right-radius:0; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { border:1px solid #128C7E; color:#128C7E; background:#fff; border-radius:14px; padding:5px 10px; font-size:.78rem; cursor:pointer; }
  .inputbar { display:flex; gap:8px; padding:10px; background:#f0f0f0; }
  .inputbar input { flex:1; border:none; border-radius:18px; padding:9px 14px; font-size:.9rem; }
  .inputbar button { border:none; background:#25D366; color:#fff; border-radius:50%; width:36px; height:36px; cursor:pointer; }
</style>
</head>
<body>
  <div class="card">
    <div class="header">PawFresh Pet Nutrition<small>Python / Flask backend — not static HTML</small></div>
    <div class="messages" id="messages"></div>
    <div class="inputbar">
      <input id="input" placeholder="Type a message" onkeydown="if(event.key==='Enter')send()">
      <button onclick="send()">&#10148;</button>
    </div>
  </div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');

function addBubble(text, who, chips) {
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const inner = document.createElement('div');
  inner.className = who;
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  inner.appendChild(bubble);
  row.appendChild(inner);
  messagesEl.appendChild(row);

  if (chips && chips.length) {
    const chipRow = document.createElement('div');
    chipRow.className = 'chips';
    chips.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = c;
      btn.onclick = () => submit(c);
      chipRow.appendChild(btn);
    });
    messagesEl.appendChild(chipRow);
  }
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function submit(text, showUserBubble = true) {
  if (showUserBubble) addBubble(text, 'user');
  const res = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ message: text })
  });
  const data = await res.json();
  addBubble(data.reply, 'bot', data.quick_replies);
}

function send() {
  const val = inputEl.value.trim();
  if (!val) return;
  inputEl.value = '';
  submit(val);
}

// Kick off with a greeting from the real Python backend (silently, no
// visible "hi" from the user — this just triggers the bot's opening message).
submit('hi', false);
</script>
</body>
</html>
